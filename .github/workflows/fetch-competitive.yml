name: Fetch competitor reviews

on:
  schedule:
    - cron: "0 10 * * *"   # daily 10:00 UTC (routine classifies at 11:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install google-play-scraper

      - name: Fetch competitor feeds
        run: python3 fetch_competitive_feed.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add competitive_feed.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update competitive_feed.txt ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "nothing to commit"
          fi
