name: Fetch BK reviews (iOS + Android)
on:
  schedule:
    - cron: "0 11 * * *"   # daily 11:00 UTC (routine classifies at 12:00 UTC)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install google-play-scraper
      - name: Fetch feeds
        run: python3 fetch_feed.py
      - name: Prune reviews older than 40 days
        run: python3 prune_old.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add feed.txt reviews.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update feed + prune >40d ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "nothing to commit"
          fi
