name: Classify competitive UX features

on:
  schedule:
    - cron: "23 11 * * *"   # daily 11:23 UTC (after fetch-competitive at 10:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify new reviews
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 classify_competitive.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add competitive_reviews.csv competitive_processed_ids.txt
          if ! git diff --cached --quiet; then
            git commit -m "Auto-classify competitive features ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No new features found today"
          fi
