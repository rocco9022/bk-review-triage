name: Notify new competitive UX features

on:
  push:
    branches: [main]
    paths: [competitive_tracker.csv]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send a test email with sample data'
        required: false
        default: 'true'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract new confirmed UX features
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Test mode: hardcoded sample so email always fires
            features="FEATURE_START
App/Competitor: McDonald's [TEST]
Feature: Ready on Arrival geofencing — kitchen starts your order when your phone enters the parking lot radius.
Category: Ordering flow
Type: Announced
Source: PYMNTS / App Store reviews
Link: https://www.pymnts.com/restaurant-innovation/2024/mcdonalds-says-geofencing-technology-helps-boost-customer-satisfaction/
Notes: Customer satisfaction improved and drive-thru wait times reduced by 60 seconds for curbside orders. Frictionless once location permission is granted.
FEATURE_END"
          else
            # Normal mode: diff the push
            features=$(git diff HEAD~1 HEAD -- competitive_tracker.csv \
              | grep '^+' \
              | grep -v '^+++' \
              | cut -c2- \
              | python3 << 'PYEOF'
          import sys, csv
          rows = []
          for line in sys.stdin:
              line = line.rstrip('\n')
              try:
                  parsed = next(csv.reader([line]))
              except Exception:
                  continue
              if len(parsed) < 4: continue
              row_type = parsed[1].strip() if len(parsed) > 1 else ''
              if row_type not in ('Announced', 'Confirmed'): continue
              rows.append(parsed)
          for r in rows:
              r += [''] * 12
              date, rtype, competitor, feature, category, confidence, _, _, source, link, notes = r[:11]
              print(f"FEATURE_START")
              print(f"App/Competitor: {competitor}")
              print(f"Feature: {feature}")
              print(f"Category: {category}")
              print(f"Type: {rtype}")
              print(f"Source: {source}")
              print(f"Link: {link}")
              if notes.strip():
                  print(f"Notes: {notes}")
              print(f"FEATURE_END")
          PYEOF
          )
          fi

          if [ -z "$features" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "features<<FEATEOF"
              printf '%s' "$features"
              echo ""
              echo "FEATEOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Send email via Resend
        if: steps.check.outputs.found == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FEATURES: ${{ steps.check.outputs.features }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, re

          raw = os.environ.get("FEATURES", "")
          api_key = os.environ["RESEND_API_KEY"]

          blocks = re.findall(r'FEATURE_START\n(.*?)\nFEATURE_END', raw, re.DOTALL)

          def e(s):
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          cards = ""
          for block in blocks:
              fields = {}
              for line in block.strip().splitlines():
                  if ': ' in line:
                      k, v = line.split(': ', 1)
                      fields[k.strip()] = v.strip()

              link = fields.get("Link", "")
              link_html = f'<a href="{e(link)}">{e(link)}</a>' if link else "—"

              cards += f"""
              <div style="border:1px solid #e0e0e0;border-radius:8px;padding:16px;margin-bottom:16px;background:#fff;">
                <div style="font-size:11px;text-transform:uppercase;color:#888;margin-bottom:4px">{e(fields.get('Type',''))} · {e(fields.get('Category',''))}</div>
                <div style="font-size:18px;font-weight:700;color:#D62300;margin-bottom:2px">{e(fields.get('App/Competitor',''))}</div>
                <div style="font-size:15px;margin-bottom:10px">{e(fields.get('Feature',''))}</div>
                <div style="font-size:13px;color:#555;margin-bottom:4px"><b>Source:</b> {e(fields.get('Source',''))}</div>
                <div style="font-size:13px;color:#555;margin-bottom:4px"><b>Link:</b> {link_html}</div>
              """
              if fields.get("Notes"):
                  cards += f'<div style="font-size:12px;color:#666;border-top:1px solid #eee;margin-top:10px;padding-top:8px">{e(fields.get("Notes",""))}</div>'
              cards += "</div>"

          count = len(blocks)
          subject = f"{'New competitive UX feature' if count == 1 else f'{count} new competitive UX features'} worth watching"

          html = f"""
          <div style="font-family:sans-serif;max-width:600px;margin:0 auto;background:#f8f8f8;padding:24px">
            <h2 style="color:#D62300;margin-top:0">&#x1F440; Competitive UX Intel</h2>
            <p style="color:#444">{'A competitor just shipped' if count == 1 else 'Competitors just shipped'} something worth watching:</p>
            {cards}
            <p style="font-size:11px;color:#aaa;margin-top:24px">BK Review Triage · <a href="https://github.com/rocco9022/bk-review-triage">repo</a></p>
          </div>
          """

          payload = json.dumps({
              "from": "BK Triage <onboarding@resend.dev>",
              "to": ["leandro.rocco@santexgroup.com"],
              "subject": subject,
              "html": html,
          }).encode()

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=payload,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              print("Email sent:", resp.status, resp.read().decode())
          PYEOF
