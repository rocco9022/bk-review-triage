name: Notify new competitive UX features

on:
  push:
    branches: [main]
    paths: [competitive_tracker.csv]
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract new confirmed UX features
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          features=$(python3 << 'PYEOF'
          import sys, csv, os, subprocess

          event = os.environ.get("EVENT_NAME", "push")

          def emit(competitor, rtype, feature, category, source, link, notes):
              print("FEATURE_START")
              print(f"App/Competitor: {competitor}")
              print(f"Feature: {feature}")
              print(f"Category: {category}")
              print(f"Type: {rtype}")
              print(f"Source: {source}")
              print(f"Link: {link}")
              if notes.strip():
                  print(f"Notes: {notes}")
              print("FEATURE_END")

          if event == "workflow_dispatch":
              # Test mode: hardcoded sample
              emit(
                  "McDonald's [TEST]",
                  "Announced",
                  "Ready on Arrival geofencing: kitchen starts your order when your phone enters the parking lot.",
                  "Ordering flow",
                  "PYMNTS / App Store reviews",
                  "https://www.pymnts.com/restaurant-innovation/2024/mcdonalds-says-geofencing-technology-helps-boost-customer-satisfaction/",
                  "Drive-thru wait times reduced by 60s for curbside orders. Frictionless once location permission is granted.",
              )
          else:
              diff = subprocess.check_output(
                  ["git", "diff", "HEAD~1", "HEAD", "--", "competitive_tracker.csv"],
                  text=True,
              )
              for line in diff.splitlines():
                  if not line.startswith("+") or line.startswith("+++"):
                      continue
                  line = line[1:]
                  try:
                      parsed = next(csv.reader([line]))
                  except Exception:
                      continue
                  if len(parsed) < 4:
                      continue
                  rtype = parsed[1].strip()
                  if rtype not in ("Announced", "Confirmed"):
                      continue
                  parsed += [""] * 12
                  date, rtype, competitor, feature, category, confidence, _, _, source, link, notes = parsed[:11]
                  emit(competitor, rtype, feature, category, source, link, notes)
          PYEOF
          )

          if [ -z "$features" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "features<<FEATEOF"
              printf '%s\n' "$features"
              echo "FEATEOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log new features
        if: steps.check.outputs.found == 'true'
        env:
          FEATURES: ${{ steps.check.outputs.features }}
        run: |
          echo "New competitive features detected:"
          echo "$FEATURES"

      # To re-enable email notifications via Resend, restore the step below
      # and set the RESEND_API_KEY secret in repo Settings → Secrets.
