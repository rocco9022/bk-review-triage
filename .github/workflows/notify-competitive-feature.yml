      #   if: steps.check.outputs.found == 'true'
      #   env:
      #     RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      #     FEATURES: ${{ steps.check.outputs.features }}
      #   run: |
      #     ... (email sending logic)
